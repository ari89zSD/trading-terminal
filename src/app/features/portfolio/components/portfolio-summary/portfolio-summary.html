<div class="summary-card" *ngIf="summary$ | async as s">
  <h2>Portfolio Summary</h2>

  <div class="row">
    <div class="label">Total Value</div>
    <div class="value">{{ s.totalValue | number:'1.2-2' }}</div>
  </div>

  <div class="row">
    <div class="label">Cash</div>
    <div class="value">{{ s.cash | number:'1.2-2' }}</div>
  </div>

  <div class="row">
    <div class="label">Market Value</div>
    <div class="value">{{ s.marketValue | number:'1.2-2' }}</div>
  </div>

  <div class="row">
    <div class="label">Unrealized P/L</div>
    <div class="value" [class.profit]="s.unrealizedPL >= 0" [class.loss]="s.unrealizedPL < 0">
      {{ s.unrealizedPL | number:'1.2-2' }}
    </div>
  </div>

  <div class="row">
    <div class="label">Realized P/L</div>
    <div class="value" [class.profit]="s.realizedPL >= 0" [class.loss]="s.realizedPL < 0">
      {{ s.realizedPL | number:'1.2-2' }}
    </div>
  </div>
</div>
