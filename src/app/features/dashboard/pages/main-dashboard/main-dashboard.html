<div class="dashboard">

  <!-- Watchlist Input -->
  <div class="watchlist-input">
    <input #symbolInput placeholder="Add symbol (e.g., NVDA)" />
    <button (click)="addSymbol(symbolInput.value)">Add</button>
  </div>

  <!-- Watchlist List -->
  <div class="watchlist-list">
    <div class="item" *ngFor="let s of watchlist$ | async">
      <span class="symbol" (click)="selectSymbol(s)">{{ s }}</span>
      <button class="remove" (click)="removeSymbol(s)">×</button>
    </div>
  </div>

  <!-- Quote Table -->
  <app-quote-list></app-quote-list>

  <!-- Chart -->
  <ng-container *ngIf="candles$ | async as candles">
    <app-symbol-chart
      *ngIf="selectedSymbol"
      [symbol]="selectedSymbol!"
      [candles]="candles">
    </app-symbol-chart>
  </ng-container>
</div>
