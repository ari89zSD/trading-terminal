<ng-container *ngIf="quotes$ | async as quotes">
  <table mat-table [dataSource]="quotes" class="quote-table">

    <!-- Symbol -->
    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef> Symbol </th>
      <td mat-cell *matCellDef="let q"> {{ q.symbol }} </td>
    </ng-container>

    <!-- Last -->
    <ng-container matColumnDef="last">
      <th mat-header-cell *matHeaderCellDef> Last </th>
      <td mat-cell *matCellDef="let q"> {{ q.last }} </td>
    </ng-container>

    <!-- Bid/Ask -->
    <ng-container matColumnDef="bidask">
      <th mat-header-cell *matHeaderCellDef> Bid / Ask </th>
      <td mat-cell *matCellDef="let q">
        {{ q.bid }} / {{ q.ask }}
      </td>
    </ng-container>

    <!-- Change -->
    <ng-container matColumnDef="change">
      <th mat-header-cell *matHeaderCellDef> Change </th>
      <td mat-cell *matCellDef="let q"
          [class.positive]="getChange(q).positive"
          [class.negative]="!getChange(q).positive">
        {{ getChange(q).abs }} ({{ getChange(q).pct }}%)
      </td>
    </ng-container>

    <!-- Trade Button -->
    <ng-container matColumnDef="trade">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let q">
        <button class="trade-btn" (click)="openTrade(q.symbol)">
          Trade
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</ng-container>
